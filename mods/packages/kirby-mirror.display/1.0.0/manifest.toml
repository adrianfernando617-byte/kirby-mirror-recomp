# kirby-mirror.display — built-in display package.
#
# Preloaded package (copied beside the executable by the build) for the
# declarative mod catalog. Trusted plugin lives in the game binary:
# src/mod_widescreen.cpp (plugin id "kirby-mirror.widescreen").
#
# The game_id/rom_sha1 pair must match RunOptions::mod_game_id and the
# USA stock image hash. ROM bytes are never installed or redistributed.

format_version = 1
id = "kirby-mirror.display"
version = "1.0.0"
name = "Kirby Mirror Display Enhancements"
author = "KirbyMirrorRecomp contributors"
description = "Presentation features for Kirby & The Amazing Mirror (USA)."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "kirby-amazing-mirror-us"
rom_sha1 = "274b102b6d940f46861a92b4e65f89a51815c12c"

[[feature]]
id = "widescreen"
name = "Widescreen"
description = "Extend the logical view beyond the native 240px width. Margin presentation is owned by the trusted plugin: wrap (vanilla tile ring), clamp (continue the nearest native column) or black (solid pillars)."
group = "Display"
default_enabled = true

[[option]]
feature = "widescreen"
id = "width"
label = "Logical width"
description = "Extended logical view width, up to the engine ceiling of 896px (~3.7 native screens; the runner letterboxes to the window aspect). Rooms with wide room-canvases fill it with real map content; beyond the canvas, margins repeat the room's own edge wall."
type = "choice"
default = "896"

[[option.choice]]
value = "896"
label = "896 (máximo da engine — 32:9)"

[[option.choice]]
value = "608"
label = "608 (ultrawide 21:9+)"

[[option.choice]]
value = "426"
label = "426 (2x a tela do GBA)"

[[option.choice]]
value = "304"
label = "304 (margens de 4 tiles por lado)"

[[option.choice]]
value = "284"
label = "284 (16:9 exato)"

[[option.choice]]
value = "240"
label = "240 (padrão do console)"

[[option]]
feature = "widescreen"
id = "margins"
label = "margin policy"
description = "How margin columns render: wide shows real map content beyond the screen (the room canvas, read host-side); wrap repeats the guest tile ring; clamp continues the nearest native column; black draws solid margins."
type = "choice"
default = "wide"

[[option.choice]]
value = "wide"
label = "wide (mapa real além da tela)"

[[option.choice]]
value = "wrap"
label = "wrap (anel do jogo)"

[[option.choice]]
value = "clamp"
label = "clamp (continua a coluna da borda)"

[[option.choice]]
value = "black"
label = "black (pillarbox sólido)"

[[plugin]]
feature = "widescreen"
id = "kirby-mirror.widescreen"
